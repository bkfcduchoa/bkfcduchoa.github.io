name: Deploy website to GitHub Pages

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

# Least privilege: only the deploy job can write to Pages.
permissions:
  contents: read

concurrency:
  group: pages-${{ github.event_name == 'pull_request' && github.head_ref || 'deploy' }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  # Same Hugo as local builds: the Ubuntu 26.04 LTS archive package (see README).
  HUGO_VERSION: 0.154.5

defaults:
  run:
    shell: bash

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      # actions/configure-pages reads the repository's Pages settings.
      pages: read
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install Hugo extended
        run: |
          deb="hugo_extended_${HUGO_VERSION}_linux-amd64.deb"
          curl -fsSL --retry 3 -o "${RUNNER_TEMP}/${deb}" \
            "https://github.com/gohugoio/hugo/releases/download/v${HUGO_VERSION}/${deb}"
          sudo dpkg -i "${RUNNER_TEMP}/${deb}"
          hugo version

      # The runner's preinstalled Node runs this dependency-free test; nothing is installed.
      - name: Test the Netlify footer credit
        run: node --test tests/*.test.js

      - name: Setup Pages
        id: pages
        uses: actions/configure-pages@v6

      - name: Build with Hugo
        env:
          HUGO_ENVIRONMENT: production
        run: hugo --gc --minify --baseURL "${{ steps.pages.outputs.base_url }}/"

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: ./public

  deploy:
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
