# Hugo configuration. Build with Hugo 0.154.5 extended; the theme lives in
# layouts/ and assets/ of this repo, with no modules and no Node toolchain.
# Reference: https://gohugo.io/configuration/

title: BKFC Đức Hoà
baseURL: 'https://bkfcduchoa.github.io/'

defaultContentLanguage: vi
defaultContentLanguageInSubdir: false
removePathAccents: true

enableEmoji: true
enableRobotsTXT: true
enableGitInfo: false
summaryLength: 30
disableAliases: true
# Capitalise only the first letter of generated list titles ("Tags", "Có thể bạn chưa biết").
titleCaseStyle: firstupper

pagination:
  pagerSize: 10
  # Keep the /…/page/1/ redirects the old site published.
  disableAliases: false

# Every URL the site has always used.
permalinks:
  page:
    post: '/post/:contentbasename/'
    event: '/talk/:slug/'
  term:
    tags: '/tag/:slug/'
    categories: '/category/:slug/'
    publication_types: '/publication-type/:slug/'
    authors: '/author/:slug/'

taxonomies:
  tag: tags
  category: categories
  publication_type: publication_types
  author: authors

mediaTypes:
  application/manifest+json:
    suffixes: [webmanifest]

outputFormats:
  WebAppManifest:
    mediaType: application/manifest+json
    baseName: manifest
    rel: manifest
    isPlainText: true
    notAlternative: true

outputs:
  home: [HTML, RSS, JSON, WebAppManifest]
  section: [HTML, RSS]

cascade:
  - target:
      path: "{/post/**,/event/**}"
      kind: page
    params:
      commentable: true

markup:
  highlight:
    lineNos: false
    noClasses: false
  goldmark:
    renderer:
      # Some posts carry inline HTML (coloured spans).
      unsafe: true
    extensions:
      passthrough:
        enable: true
        delimiters:
          block: [['\[', '\]'], ['$$', '$$']]
          inline: [['\(', '\)'], ['$', '$']]
      extras:
        # Posts use `^` and `~` inside plain text; these would turn them into <sup>/<sub>.
        subscript:
          enable: false
        superscript:
          enable: false

related:
  threshold: 80
  includeNewer: true
  toLower: true
  indices:
    - name: tags
      weight: 100
    - name: categories
      weight: 70
