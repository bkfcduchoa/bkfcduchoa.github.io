# Configuration of Hugo
# Guide: https://hugoblox.com/docs/
# Hugo Documentation: https://gohugo.io/getting-started/configuration/#all-configuration-settings
# This file is formatted using YAML syntax - learn more at https://learnxinyminutes.com/docs/yaml/

# Website name (also set in params.yaml under hugoblox.identity.name)
title: BKFC Đức Hoà
# Website URL
baseURL: 'https://bkfcduchoa.github.io/'

############################
## LANGUAGE
############################

defaultContentLanguage: vi
hasCJKLanguage: false
defaultContentLanguageInSubdir: false
removePathAccents: true

############################
## PAGE OPTIONS
############################

# Slide decks render only the reveal.js output, written at the page's own URL
# (`present` has no path prefix here), so /slides/<deck>/ opens the deck as before.
outputFormats:
  present:
    mediaType: text/html
    baseName: index
    isHTML: true
    permalinkable: true
    path: ''

cascade:
  - target:
      path: /slides/**
      kind: page
    outputs: [present]
  - target:
      path: /**
    params:
      commentable: true

############################
## URLS
## Content lives in the HugoBlox folder names (`blog`, `events`), but the
## permalinks below keep every URL the site has always used.
############################

permalinks:
  page:
    blog: '/post/:contentbasename/'
    events: '/talk/:slug/'
  section:
    blog: '/post/'
    events: '/event/'
  term:
    tags: '/tag/:slug/'
    categories: '/category/:slug/'
    publication_types: '/publication-type/:slug/'

############################
## ADVANCED
############################

build:
  writeStats: true
enableGitInfo: false
summaryLength: 30
pagination:
  pagerSize: 10
enableEmoji: true
enableRobotsTXT: true
footnotereturnlinkcontents: <sup>^</sup>
ignoreFiles: [\.ipynb$, .ipynb_checkpoints$, \.Rmd$, \.Rmarkdown$, _cache$]
disableAliases: true
outputs:
  home: [HTML, RSS, JSON, WebAppManifest, headers, redirects, backlinks]
  section: [HTML, RSS]
imaging:
  resampleFilter: lanczos
  quality: 90
  anchor: smart
  hint: picture
timeout: 600000
taxonomies:
  tag: tags
  category: categories
  publication_type: publication_types
  author: authors
markup:
  _merge: deep
  highlight:
    lineNos: false
  goldmark:
    extensions:
      extras:
        # The Kit turns these on; they would change existing posts that use `^` and `~` as plain text.
        subscript:
          enable: false
        superscript:
          enable: false
related:
  threshold: 80
  includeNewer: true
  toLower: true
  indices:
    - name: tags
      weight: 100
    - name: categories
      weight: 70
security:
  _merge: deep
sitemap:
  _merge: deep
minify:
  _merge: deep
