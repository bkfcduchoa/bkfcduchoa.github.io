build:
  # Hugo extended version used by CI. The Kit's blox module needs >= 0.161.1;
  # 0.162.0 (the starter's pin) fails with this module set (HugoBlox/kit#3324).
  hugo_version: '0.161.1'
deploy:
  # Deployment target: github-pages, netlify, vercel, cloudflare, or none
  host: 'github-pages'
template:
  id: "academic-cv"
  name: "Academic CV"
