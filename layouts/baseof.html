<!doctype html>
<html lang="{{ site.Language.LanguageCode }}" data-theme="light">
<head>
  {{- partial "head.html" . }}
</head>
<body>
  <a class="skip-link" href="#main">Bỏ qua đến nội dung</a>
  {{ partial "header.html" . }}
  <main id="main">
    {{- block "main" . }}{{ end }}
  </main>
  {{ partial "footer.html" . }}
  {{- with resources.Get "js/menu.js" | minify | fingerprint }}
  <script src="{{ .RelPermalink }}" integrity="{{ .Data.Integrity }}" defer></script>
  {{- end }}
</body>
</html>
