{{ define "main" }}
<div class="wrap">
  <header class="page-head">
    <h1>Trang không tìm thấy</h1>
    <p>Trang bạn tìm không tồn tại hoặc đã được chuyển đi. Có thể bạn đang tìm những trang này:</p>
  </header>
  <p class="list-grid"><a class="button" href="{{ site.Home.RelPermalink }}">Về trang chủ</a>
    <button class="button button-outline" type="button" data-search-open>{{ partial "icon.html" "search" }}Tìm kiếm</button></p>
  <h2>Mới nhất</h2>
  <ul class="card-grid">
    {{- range first 3 (where site.RegularPages "Section" "post") }}
    <li>{{ partial "post-card.html" . }}</li>
    {{- end }}
  </ul>
</div>
{{ end }}
