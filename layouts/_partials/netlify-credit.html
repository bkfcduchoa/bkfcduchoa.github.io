{{- /* Netlify's Open Source plan asks for a visible link to Netlify. Shown only when the site is
  served from a *.netlify.app host, so the GitHub Pages copy stays without it.
  Tested by tests/netlify-footer-host.test.js. */ -}}
<script>
  if (window.location.hostname.endsWith(".netlify.app")) {
    document.currentScript.insertAdjacentHTML(
      "beforebegin",
      `<p class="footer-credit">
        This site is powered by
        <a href="https://www.netlify.com" target="_blank" rel="noopener">Netlify</a>
      </p>`,
    );
  }
</script>
