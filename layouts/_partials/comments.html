{{- /* giscus comments, settings in config/_default/params.yaml. The theme follows the page's. */ -}}
{{- with site.Params.giscus }}
<section class="comments" aria-label="Bình luận">
  <script>
    (function () {
      var s = document.createElement('script');
      s.src = 'https://giscus.app/client.js';
      s.async = true;
      s.crossOrigin = 'anonymous';
      var attrs = {
        'data-repo': {{ .repo }},
        'data-repo-id': {{ .repoId }},
        'data-category': {{ .category }},
        'data-category-id': {{ .categoryId }},
        'data-mapping': {{ .mapping }},
        'data-strict': '0',
        'data-reactions-enabled': '1',
        'data-emit-metadata': '0',
        'data-input-position': 'top',
        'data-lang': {{ .lang }},
        'data-loading': 'lazy',
        'data-theme': document.documentElement.getAttribute('data-theme') === 'dark' ? 'dark' : 'light'
      };
      for (var k in attrs) s.setAttribute(k, attrs[k]);
      document.currentScript.parentNode.appendChild(s);
    })();
  </script>
  <noscript>Bật JavaScript để xem bình luận.</noscript>
</section>
{{- end }}
