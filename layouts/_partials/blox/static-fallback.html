{{/* Static HTML for Preact blocks (see blox/preact-wrapper.html), so the text and photos are in the
     page itself for visitors and crawlers that do not run JavaScript. It is plain markup, not
     <noscript>, because many crawlers skip <noscript>. Preact's render() removes it when the
     block renders. Covers the block types this site uses: hero and gallery. */}}
{{ $c := .content }}
{{ $props := .props }}
{{ $page := .page }}
{{ if eq .type "hero" }}
<div data-static-fallback>
  <div class="mx-auto max-w-3xl px-6 py-16 text-center">
    {{ with $props.media_image }}<img class="mx-auto mb-6 h-40 w-auto" src="{{ .src }}" alt="{{ $c.media.alt }}" />{{ end }}
    {{ with $c.title }}<h1 class="text-4xl font-bold">{{ $page.RenderString (dict "display" "inline") . }}</h1>{{ end }}
    {{ with $c.text }}<p class="mt-4 text-lg">{{ $page.RenderString (dict "display" "inline") . }}</p>{{ end }}
    <p class="mt-6">
      {{ range slice $c.primary_action $c.secondary_action }}
        {{ if and . .url }}<a class="mx-2 underline" href="{{ .url }}">{{ .text }}</a>{{ end }}
      {{ end }}
    </p>
    {{ with $c.trust.text }}<p class="mt-4 text-sm">{{ . }}</p>{{ end }}
  </div>
</div>
{{ else if eq .type "gallery" }}
<div data-static-fallback>
  <div class="mx-auto max-w-5xl px-6 py-8">
    {{ with $c.title }}<h2 class="mb-6 text-center text-3xl font-bold">{{ . }}</h2>{{ end }}
    <div class="grid grid-cols-1 gap-4 sm:grid-cols-2">
      {{ range $props.items }}
        {{/* Link each photo to its largest variant */}}
        {{ $full := .src }}
        {{ with .srcset }}{{ $full = index (split (index (last 1 (split . ", ")) 0) " ") 0 }}{{ end }}
        <a href="{{ $full }}"><img class="w-full rounded" src="{{ .src }}" alt="{{ .alt }}" loading="lazy" /></a>
      {{ end }}
    </div>
  </div>
</div>
{{ end }}
