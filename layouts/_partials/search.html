{{- /* Search dialog, driven by assets/js/search.js over the home JSON output (/index.json). */ -}}
{{- with site.Home.OutputFormats.Get "JSON" }}
<dialog class="search" id="search" data-index="{{ .RelPermalink }}" aria-label="Tìm kiếm">
  <form class="search-form" role="search">
    {{ partial "icon.html" "search" }}
    <input type="search" name="q" placeholder="Tìm bài viết, sự kiện…" aria-label="Từ khoá tìm kiếm" autocomplete="off" enterkeyhint="search">
    <button class="icon-button" type="button" data-search-close aria-label="Đóng">{{ partial "icon.html" "close" }}</button>
  </form>
  <p class="search-status" role="status" aria-live="polite"></p>
  <ul class="search-results"></ul>
</dialog>
{{- end }}
