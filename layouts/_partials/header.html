<header class="site-header">
  <div class="wrap">
    <a class="brand" href="{{ site.Home.RelPermalink }}">
      {{- with resources.Get "media/icon.png" }}{{ with .Fill "72x72 png" }}
      <img src="{{ .RelPermalink }}" width="36" height="36" alt="">
      {{- end }}{{ end }}
      <span>{{ site.Title }}</span>
    </a>
    <nav class="site-nav" id="site-nav" aria-label="Menu chính">
      <ul class="nav-list">
        {{- $page := . }}
        {{- range site.Menus.main }}
        {{- $current := or ($page.IsMenuCurrent "main" .) (and (eq .URL "/post/") (eq $page.Section "post")) }}
        <li><a href="{{ .URL }}"{{ if $current }} aria-current="page"{{ end }}>{{ .Name }}</a></li>
        {{- end }}
      </ul>
    </nav>
    <button class="icon-button theme-toggle" type="button" data-theme-toggle aria-label="Đổi giao diện sáng/tối" title="Đổi giao diện sáng/tối">
      {{- partial "icon.html" "moon" }}{{ partial "icon.html" "sun" -}}
    </button>
    <button class="icon-button menu-toggle" type="button" aria-controls="site-nav" aria-expanded="false" aria-label="Mở menu">
      {{- partial "icon.html" "menu" }}{{ partial "icon.html" "close" -}}
    </button>
  </div>
</header>
