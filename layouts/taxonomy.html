{{ define "main" }}
<div class="wrap">
  <header class="page-head">
    <h1>{{ .Title }}</h1>
  </header>
  {{- with .Data.Terms.ByCount }}
  <ul class="chips list-grid">
    {{- range . }}
    <li><a class="chip chip-lg" href="{{ .Page.RelPermalink }}">{{ .Page.LinkTitle }} <span class="chip-count">{{ .Count }}</span></a></li>
    {{- end }}
  </ul>
  {{- else }}
  <p>Chưa có mục nào.</p>
  {{- end }}
</div>
{{ end }}
