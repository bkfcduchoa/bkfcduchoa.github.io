# HugoBlox Font Pack
# Ports the font choice of the old "minimal" font set (Montserrat headings,
# Roboto body, Roboto Mono code). All three cover Vietnamese.

hugoblox:
  meta:
    format: "hugoblox-font@1"
    name: "Minimal"
    vendor: "bkfcduchoa"
    version: "1.0.0"
    license: "MIT"
    description: "Montserrat headings with Roboto body text"

  families:
    heading: "Montserrat"
    body: "Roboto"
    code: "Roboto Mono"

  weights:
    heading: [400, 700]
    body: [400, 700]
    code: [400]

  leading:
    heading: 1.2
    body: 1.7
    code: 1.5

  tracking:
    heading: "0"
    body: "0"
